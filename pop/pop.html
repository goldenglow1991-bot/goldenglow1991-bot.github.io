<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>足のマッサージ無料体験ポップ</title>
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#00A2FF;--navy:#0B4A7E;--orange:#F28C1E;--cream:#FFF6D6}
html,body{width:210mm;height:297mm}
body{font-family:"Noto Sans CJK JP","Hiragino Sans","Yu Gothic","WenQuanYi Zen Hei",sans-serif;color:#1d2b36;position:relative;overflow:hidden;background:#fff}
.top{background:var(--blue);height:62mm;color:#fff;text-align:center;padding-top:9mm}
.top .lead{font-size:7.2mm;font-weight:700;letter-spacing:.15em}
.top .free{display:inline-block;margin-top:3mm;background:#fff;color:var(--orange);font-weight:900;font-size:26mm;line-height:1;padding:3mm 12mm 4mm;border-radius:6mm;letter-spacing:.04em}
.top .free small{font-size:13mm;color:var(--navy)}
.main{text-align:center;margin-top:10mm}
.main h1{font-size:19mm;font-weight:900;color:var(--navy);letter-spacing:.06em;line-height:1.1}
.main h1 span{color:var(--blue)}
.main p.sub{margin-top:4mm;font-size:8mm;font-weight:700;color:#35566f}
.photo{margin:7mm auto 0;width:170mm;height:78mm;border-radius:8mm;border:2.5mm solid var(--blue);background:url(assets/massage.jpg) center 30%/cover}
.badge{position:absolute;right:14mm;top:128mm;width:44mm;height:44mm;border-radius:50%;background:var(--orange);color:#fff;font-weight:900;text-align:center;display:flex;flex-direction:column;justify-content:center;line-height:1.2;transform:rotate(8deg);box-shadow:0 1.5mm 3mm rgba(0,0,0,.25)}
.badge b{font-size:9mm}.badge span{font-size:6mm}
.info{width:170mm;margin:8mm auto 0;background:var(--cream);border-radius:6mm;padding:6mm 8mm;font-size:6.6mm;line-height:1.7;font-weight:700}
.info div{display:flex;gap:4mm}
.info dt{flex:0 0 28mm;color:#fff;background:var(--blue);border-radius:3mm;text-align:center;font-size:5.8mm;height:9mm;line-height:9mm;margin-top:1.2mm}
.info .ph{color:#c0392b;border-bottom:.4mm dashed #c0392b}
.toplogo{position:absolute;left:10mm;top:8mm;width:32mm;height:28mm;background:#fff url(assets/logo.png) center/contain no-repeat;border-radius:4mm}
.foot{position:absolute;left:0;right:0;bottom:0;height:36mm;background:var(--blue);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;line-height:1.35}
.foot .n{font-size:11mm;font-weight:900;letter-spacing:.05em}.foot .n small{font-size:6.5mm}
.foot .tel{font-size:10mm;font-weight:900;letter-spacing:.04em}
.foot .ad{font-size:5.8mm;font-weight:700}
</style></head><body>
<div class="top"><div class="toplogo"></div><div class="lead">お気軽にお立ち寄りください</div>
<div class="free">無料<small>体験</small></div></div>
<div class="main"><h1>足の<span>マッサージ</span><br>５分間</h1>
<p class="sub">座ったままでOK ・ 服のままで大丈夫 ・ 予約不要</p></div>
<div class="photo"></div>
<div class="badge"><span>お一人</span><b>５分</b><span>無料</span></div>
<dl class="info">
<div><dt>対象</dt><dd>どなたでもご体験いただけます</dd></div>
<div><dt>時間</dt><dd><span class="ph">【○時〜○時】</span>（なくなり次第終了）</dd></div>
<div><dt>場所</dt><dd><span class="ph">【ブース名・会場内の場所】</span></dd></div>
</dl>
<div class="foot"><div class="n">デイサービス薫 <small>~kaoru~</small></div>
<div class="tel">TEL 0569-84-1971</div>
<div class="ad">半田市新居町1-41-7　／　月〜金 9:00〜12:00・13:30〜16:30</div></div>
</body></html>
